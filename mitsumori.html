};

// 作業内容ごとに、サイズ入力(Φ×厚)欄を出す対象かどうか
const CORE_SIZE_WORKS = ["コア抜き", "DPコア抜き", "フェローデッキコア抜き", "DP＋RCコア抜き"];
function hasCoreSize(work) {
  return CORE_SIZE_WORKS.indexOf(work) !== -1;
}

// 作業内容ごとに、自動単価表があるかどうか(ある場合のみ自動計算・範囲外表示を行う)
function coreTableForWork(work) {
  if (work === "コア抜き") return CORE_PRICE_TABLE;
  if (work === "DPコア抜き") return CORE_PRICE_TABLE_DP;
  return null; // フェローデッキコア抜き・DP＋RCコア抜きは単価表がないため手入力
}

function lookupCorePrice(diameter, depth, work) {
  const d = parseFloat(diameter);
  const l = parseFloat(depth);
  if (isNaN(d) || isNaN(l) || d < 32 || d > 310 || l <= 0 || l > 500) return null;
  const table = coreTableForWork(work);
  if (!table) return null;
  const row = table.rows.find((r) => d <= r.maxDia);
  if (!row) return null;
  const colIdx = table.depthCols.findIndex((c) => l <= c);
  if (colIdx === -1) return null;
  return row.prices[colIdx];
}

// 作業伝票側の古い作業内容名 → 見積書・請求書側の新しい作業内容名
const GENBA_WORK_TYPE_MAP = { "はつり": "斫り", "雑工": "自由入力" };

// 作業伝票から読み込んだ明細行を、見積書・請求書の明細行の形式に変換する
function mapGenbaLineItem(it) {
  let work = GENBA_WORK_TYPE_MAP[it.work] || it.work;
  if (WORK_TYPES.indexOf(work) === -1) work = "自由入力";
  const workCustom = work === "自由入力" ? (it.work || "") : "";
  const noteParts = [];
  if (it.haturiLength) noteParts.push("斫り長:" + it.haturiLength);
  if (it.note) noteParts.push(it.note);
  return {
    id: uid(),
    work,
    workCustom,
    // 作業伝票の「作業場所」を見積書・請求書の「品名・補足」欄にそのまま反映する
    label: it.location || "",
    diameter: it.diameter || "",
    depth: it.depth || "",
    coreType: "通常",
    length: it.length || "",
    width: it.width || "",
    qty: it.qty || "1",
    unit: UNITS.indexOf(it.unit) !== -1 ? it.unit : UNITS[0],
    price: it.price || "",
    note: noteParts.join(" "),
    autoPriced: false,
  };
}

// 作業伝票読み込みモーダルの状態(保存はしない。画面表示のみに使う)
let importModal = { show: false, loading: false, error: "", entries: [], query: "" };

async function openImportModal() {
  const url = GENBA_LOG_API_URLS[state.issuerPreset];
  importModal = { show: true, loading: true, error: "", entries: [], query: "" };
  render();
  if (!url) {
    importModal.loading = false;
    importModal.error = "この発行者には作業伝票アプリの連携先が設定されていません。";
    render();
    return;
  }
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    const entries = Array.isArray(data) ? data : [];
    entries.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    importModal.entries = entries;
    importModal.loading = false;
  } catch (err) {
    importModal.loading = false;
    importModal.error = "作業伝票データの読み込みに失敗しました。通信状況を確認してもう一度お試しください。";
  }
  render();
}

function closeImportModal() {
  importModal = { show: false, loading: false, error: "", entries: [], query: "" };
  render();
}

function bindImportEntryButtons() {

function importGenbaEntry(entryId) {
  const entry = importModal.entries.find((e) => e.id === entryId);
  if (!entry) return;
  const mapped = (entry.lineItems || []).map(mapGenbaLineItem).filter((it) => it.qty !== "" || it.price !== "" || it.label || it.workCustom);
  if (mapped.length === 0) mapped.push(newLineItem());

  // 現在の明細が未入力の初期状態(1行だけ・空)なら読み込んだ内容で置き換え、
  // すでに何か入力されていれば末尾に追加する
  const first = state.items[0];
  const isBlankState = state.items.length === 1 && !first.price && !first.label && !first.workCustom &&
    !first.note && !first.diameter && !first.length && !first.width &&
    (first.qty === "" || first.qty === "1") && first.work === WORK_TYPES[0];
  if (isBlankState) {
    state.items = mapped;
  } else {
    state.items = state.items.concat(mapped);
  }

  if (!state.siteName.trim()) state.siteName = entry.siteName || "";
  if (!state.workDate) state.workDate = entry.date || "";
  if (!state.clientName.trim() && entry.clientCompany) state.clientName = entry.clientCompany;

  closeImportModal();
  saveDraft();
  render();
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      if (!state.items || state.items.length === 0) state.items = [newLineItem()];
      if (!Array.isArray(state.bankLines) || state.bankLines.length === 0) {
        const preset = ISSUER_PRESETS[state.issuerPreset] || ISSUER_PRESETS["ナカミネ"];
        state.bankLines = (preset.bankLines || [""]).slice();
      }
      if (!Array.isArray(state.documents)) state.documents = [];
      if (!state.clientSettings || typeof state.clientSettings !== "object" || Array.isArray(state.clientSettings)) {
        state.clientSettings = {};
      }
      if (!state.tab) state.tab = "作成";
    }
  } catch (e) {}
}

function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function toNum(v) {
  if (v == null) return NaN;
  return parseFloat(String(v).replace(/,/g, ""));
}

function fmtYen(n) {
  return "¥" + Math.round(n || 0).toLocaleString();
}

function fmtNum(n) {
  return Math.round(n || 0).toLocaleString();
}

function isHeading(it) {
  return it.work === "見出し行";
}

function lineTotal(it) {
  if (isHeading(it)) return 0;
  const price = toNum(it.price);
  if (isNaN(price)) return 0;
  const qty = toNum(it.qty);
  const multiplier = !isNaN(qty) && qty > 0 ? qty : 1;
  return price * multiplier;
}

function subtotal() {
  return state.items.reduce((sum, it) => sum + lineTotal(it), 0);
}

function misc() {
  const v = toNum(state.miscExpense);
  return isNaN(v) ? 0 : v;
}

// 法定福利費 = 工事代金(小計) × 労務比率75% × 事業主負担分16.05%
function legalWelfare() {
  return Math.round(subtotal() * 0.75 * 0.1605);
}

function legalWelfareFormula() {
  return "工事代金" + fmtNum(subtotal()) + "×労務比率75%×事業主負担分16.05%＝" + fmtNum(legalWelfare()) + "を含む";
}

// 法定福利費は工事代金(小計)に含まれている想定のため、合計には加算しない(表示のみ)
function taxBase() {
  return subtotal() + misc();
}

function eightPercentBase() {
  const v = toNum(state.eightPercentAmount);
  return isNaN(v) ? 0 : v;
}

function tenPercentBase() {
  return Math.max(0, taxBase() - eightPercentBase());
}

function tax() {
  return Math.round(tenPercentBase() * 0.1) + Math.round(eightPercentBase() * 0.08);
}

function grandTotal() {
  return taxBase() + tax();
}

// 郵便番号欄は〒マークを別表示するため、値側に含まれる〒は表示用に取り除く
function stripPostalMark(v) {
  return String(v == null ? "" : v).replace(/^〒\s*/, "");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function saveDocument() {
  if (!state.clientName.trim()) {
    alert("宛先(会社名)を入力してから保存してください。");
    return;
  }
  const record = docToRecord();
  const idx = state.documents.findIndex((d) => d.id === record.id);
  if (idx !== -1) {
    // 既存書類を上書き保存するときは、入金済み/未入金のフラグはそのまま引き継ぐ
    record.paid = state.documents[idx].paid || false;
    state.documents[idx] = record;
  } else {
    record.paid = false;
    state.documents.push(record);
  }
  state.editingDocId = record.id;
  saveDraft();
  render();
  if (API_URL) {
    const ok = await saveDocumentsToCloud();
    if (!ok) {
      alert("この端末には保存しましたが、共有サーバーへの送信に失敗しました。通信状況をご確認のうえ、もう一度保存してください。");
      return;
    }
  }
  alert("保存しました。「一覧」「集計」タブから確認・修正・削除できます。");
}

async function deleteDocument(id) {

  const ok = confirm(
    "この書類を削除します。よろしいですか?\n" +
    doc.docType + " No." + (doc.docNumber || "(なし)") + "\n" +

function buildCompanySummary(year) {
  const map = {};
  state.documents.forEach((doc) => {
    const y = (doc.docDate || "").slice(0, 4);
    if (year !== "all" && y !== year) return;
    const key = doc.clientName && doc.clientName.trim() ? doc.clientName : "(未設定)";
    if (!map[key]) map[key] = { estimateTotal: 0, invoiceTotal: 0, unpaidInvoiceTotal: 0, count: 0, months: {} };
    const g = map[key];
    g.count++;
    const amt = doc.grandTotal || 0;
    if (doc.docType === "見積書") {
      g.estimateTotal += amt;
    } else {
      g.invoiceTotal += amt;
      if (!doc.paid) g.unpaidInvoiceTotal += amt;
    }
    const m = parseInt((doc.docDate || "").slice(5, 7), 10);
    if (m) {
      if (!g.months[m]) g.months[m] = { estimateTotal: 0, invoiceTotal: 0, unpaidTotal: 0 };
      if (doc.docType === "見積書") {
        g.months[m].estimateTotal += amt;
      } else {
        g.months[m].invoiceTotal += amt;
        if (!doc.paid) g.months[m].unpaidTotal += amt;
      }
    }
  });
  return map;
}

// 全社合計(会社を分けず、月別・年間で合計する)
function buildOverallMonthly(year) {
  const months = {};
  let yearEstimate = 0, yearInvoice = 0, yearUnpaid = 0;
  state.documents.forEach((doc) => {
    const y = (doc.docDate || "").slice(0, 4);
    if (y !== year) return;
    const m = parseInt((doc.docDate || "").slice(5, 7), 10);
    if (!m) return;
    if (!months[m]) months[m] = { estimateTotal: 0, invoiceTotal: 0, unpaidTotal: 0 };
    const amt = doc.grandTotal || 0;
    if (doc.docType === "見積書") {
      months[m].estimateTotal += amt;
      yearEstimate += amt;
    } else {
      months[m].invoiceTotal += amt;
      yearInvoice += amt;
      if (!doc.paid) {
        months[m].unpaidTotal += amt;
        yearUnpaid += amt;
      }
    }
  });
  return { months, yearEstimate, yearInvoice, yearUnpaid };
}

function getAvailableYears() {
  const years = new Set();
  state.documents.forEach((d) => { if (d.docDate) years.add(d.docDate.slice(0, 4)); });
  years.add(String(new Date().getFullYear()));
  return Array.from(years).sort().reverse();
}

function getCurrentSummaryYear() {
  const years = getAvailableYears();
  return years.indexOf(state.summaryYear) !== -1 ? state.summaryYear : years[0];
}

// 過去に保存した見積書・請求書から宛先(会社)情報を集めて予測変換候補にする
function getKnownClients() {
  const map = {};
  state.documents
    .slice()
    .sort((a, b) => (a.savedAt || "").localeCompare(b.savedAt || ""))
    .forEach((d) => {
      const name = (d.clientName || "").trim();
      if (!name) return;
      map[name] = {
        name,
        postal: d.clientPostal || "",
        address: d.clientAddress || "",
        tel: d.clientTel || "",
        fax: d.clientFax || "",
        honorific: d.clientHonorific || "様",
      };
    });
  return Object.values(map);
}

// 見積書/請求書それぞれ、保存済み書類のNo.から次の連番(1,2,3...)を割り出す
function getNextDocNumber(docType) {
  let max = 0;
  state.documents.forEach((d) => {
    if (d.docType !== docType) return;
    const m = String(d.docNumber || "").match(/(\d+)\s*$/);
    const n = m ? parseInt(m[1], 10) : 0;
    if (n > max) max = n;
  });
  return String(max + 1);
}

/* ===================== 共有(クラウド同期)まわり ===================== */

async function loadDocumentsFromCloud(silent) {
  if (!API_URL) return;
  if (!silent) { syncStatus.syncing = true; render(); }
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    const data = await res.json();
    if (data && Array.isArray(data.documents)) state.documents = data.documents;
    if (data && data.clientSettings && typeof data.clientSettings === "object" && !Array.isArray(data.clientSettings)) {
      state.clientSettings = data.clientSettings;
    }
    syncStatus.error = false;
    saveDraft();
  } catch (e) {
    console.error("共有データの取得に失敗しました", e);
    syncStatus.error = true;
  }
  syncStatus.syncing = false;
  render();
}

async function saveDocumentsToCloud() {
  if (!API_URL) return true;
  syncStatus.syncing = true; render();
  let ok = false;
  for (let attempt = 0; attempt < 2 && !ok; attempt++) {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ documents: state.documents, clientSettings: state.clientSettings }),
      });
      const data = await res.json().catch(() => null);
      ok = !data || data.ok !== false;
    } catch (e) {
      console.error("共有データの保存に失敗しました", e);
      ok = false;
    }
    if (!ok && attempt === 0) await new Promise((r) => setTimeout(r, 700));
  }
  syncStatus.error = !ok;
  syncStatus.syncing = false;
  render();
  return ok;
}

// Excelのシート名に使えない文字(\ / ? * [ ] :)を置き換え、31文字以内にする
function sanitizeSheetName(name, used) {
  let s = String(name == null ? "" : name).replace(/[\\\/\?\*\[\]:]/g, "_").trim();
  if (!s) s = "会社";
  if (s.length > 31) s = s.slice(0, 31);
  let base = s;
  let i = 2;
  while (used.has(s)) {
    const suffix = "_" + i;
    s = base.slice(0, 31 - suffix.length) + suffix;
    i++;
  }
  used.add(s);
  return s;
}

function exportSummaryExcel() {
  if (typeof XLSX === "undefined") {
    alert("Excel出力の準備ができていません。インターネットに接続した状態で、もう一度お試しください。");
    return;
  }
  const year = getCurrentSummaryYear();
  const summary = buildCompanySummary(year);
  const companies = Object.keys(summary).sort();
  const usedNames = new Set();
  const wb = XLSX.utils.book_new();

  // 年間・会社別集計
  const companyRows = [["会社名", "件数", "見積合計", "請求合計", "未入金", "締め日", "支払い日"]];
  companies.forEach((c) => {
    const s = summary[c];
    const cs = getClientSetting(c);
    companyRows.push([c, s.count, s.estimateTotal, s.invoiceTotal, s.unpaidInvoiceTotal, cs.closingDay || "", cs.paymentDay || ""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(companyRows), sanitizeSheetName("会社別集計", usedNames));

  // 全社合計(月別)
  const overall = buildOverallMonthly(year);
  const overallRows = [["月", "見積合計", "請求合計", "未入金"]];
  for (let m = 1; m <= 12; m++) {
    const md = overall.months[m] || { estimateTotal: 0, invoiceTotal: 0, unpaidTotal: 0 };
    overallRows.push([m + "月", md.estimateTotal, md.invoiceTotal, md.unpaidTotal]);
  }
  overallRows.push(["年間合計", overall.yearEstimate, overall.yearInvoice, overall.yearUnpaid]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overallRows), sanitizeSheetName("全社合計(月別)", usedNames));

  // 未入金の請求書
  const unpaidRows = [["種別", "No.", "日付", "施工日", "現場名", "会社名", "金額"]];
  state.documents
    .filter((d) => d.docType === "請求書" && !d.paid)
    .sort((a, b) => (a.docDate || "").localeCompare(b.docDate || ""))
    .forEach((d) => {
      unpaidRows.push([d.docType, d.docNumber || "", d.docDate || "", d.workDate || "", d.siteName || "", d.clientName || "", d.grandTotal || 0]);
    });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(unpaidRows), sanitizeSheetName("未入金請求書", usedNames));

  // 会社ごとの月別明細・書類一覧
  companies.forEach((c) => {
    const data = summary[c];
    const rows = [["月", "見積合計", "請求合計", "未入金"]];
    for (let m = 1; m <= 12; m++) {
      const md = data.months[m];
      if (!md) continue;
      rows.push([m + "月", md.estimateTotal, md.invoiceTotal, md.unpaidTotal]);
    }
    rows.push(["年間合計", data.estimateTotal, data.invoiceTotal, data.unpaidInvoiceTotal]);
    rows.push([]);
    rows.push(["書類一覧"]);
    rows.push(["種別", "No.", "日付", "施工日", "現場名", "金額", "入金状況"]);
    state.documents
      .filter((d) => (d.clientName && d.clientName.trim() ? d.clientName : "(未設定)") === c && (d.docDate || "").slice(0, 4) === year)
      .sort((a, b) => (b.docDate || "").localeCompare(a.docDate || ""))
      .forEach((d) => {
        rows.push([d.docType, d.docNumber || "", d.docDate || "", d.workDate || "", d.siteName || "", d.grandTotal || 0, d.docType === "請求書" ? (d.paid ? "入金済み" : "未入金") : ""]);
      });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sanitizeSheetName(c, usedNames));
  });

  XLSX.writeFile(wb, `売上集計_${year}年.xlsx`);
}

          <div class="sub-row2">

            <option value="JFコア工業" ${state.issuerPreset === "JFコア工業" ? "selected" : ""}>JFコア工業　㈱ジャストフレンズ</option>

          <div class="name-row">
            <input type="text" class="company-name" id="issuer-name-input" value="${esc(state.issuerName)}" />

          <div class="sub-row"><input type="text" id="issuer-address-input" value="${esc(state.issuerAddress)}" /></div>
          <div class="sub-row2">
            <div class="prefix-field tel-fax-field"><span class="prefix-label">TEL</span><input type="text" id="issuer-tel-input" value="${esc(state.issuerTel)}" /></div>
            <div class="prefix-field tel-fax-field"><span class="prefix-label">FAX</span><input type="text" id="issuer-fax-input" value="${esc(state.issuerFax)}" /></div>

          ${state.docType === "請求書" ? `

              <p class="title">お振込先</p>

                <div class="bank-line-row">
                  <input type="text" data-bank-idx="${i}" placeholder="例: 北海道銀行　〇〇支店　普)1234567" value="${esc(line)}" />
                  <button class="del-btn no-print" data-action="del-bank-line" data-idx="${i}">🗑</button>

              `).join("")}
              <button class="add-bank-btn no-print" data-action="add-bank-line">+ 振込先を追加</button>

      <div class="total-box">

        <span class="val" id="total-box-val">${esc(fmtYen(grandTotal()))}</span>
      </div>

      <div class="site-row" style="display:flex;align-items:flex-end;gap:8px;">
        <div style="flex:1;min-width:0;">
          <label class="sm">現場名</label>
          <input type="text" id="site-input" placeholder="例: 〇〇マンション新築工事" value="${esc(state.siteName)}" style="width:100%;box-sizing:border-box;" />

        ${GENBA_LOG_API_URLS[state.issuerPreset] ? `<button type="button" class="no-print" data-action="import-genba" style="flex-shrink:0;font-size:12px;background:#fff;border:1px solid #d6d3d1;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap;">📥 作業伝票から読込</button>` : ""}

      <div class="items-table-wrap">
        <table class="items">
          <thead>
            <tr>
              <th style="width:11%;">作業内容</th>
              <th style="width:15%;">品名</th>
              <th style="width:9%;">数量</th>
              <th style="width:9%;">単位</th>

      <div class="totals-wrap">
        <div class="totals">

          <div class="totals-row" style="align-items:flex-start;">
            <label>法定福利費</label>
            <span id="totals-legal" style="font-size:10.5px;text-align:right;max-width:200px;line-height:1.4;">${esc(legalWelfareFormula())}</span>
          </div>

            <label>諸経費</label>
            <input type="text" inputmode="decimal" class="misc-input" id="misc-input" placeholder="0" value="${esc(state.miscExpense)}" />
          </div>
          <div class="totals-row"><label class="misc-note-label">　</label><input type="text" id="misc-note-input" class="misc-note-input" placeholder="例: 交通費など" value="${esc(state.miscNote)}" /></div>
          <div class="totals-row"><label>10%対象</label><span id="totals-ten">${esc(fmtNum(tenPercentBase()))}</span></div>
          <div class="totals-row">
            <label>8%対象</label>
            <input type="text" inputmode="decimal" class="misc-input" id="eight-percent-input" placeholder="0" value="${esc(state.eightPercentAmount)}" />
          </div>
          <div class="totals-row"><label>消費税</label><span id="totals-tax">${esc(fmtNum(tax()))}</span></div>
          <div class="totals-row grand"><label>${state.docType === "請求書" ? "今回御請求額" : "合計金額"}</label><span id="totals-grand">${esc(fmtYen(grandTotal()))}</span></div>
        </div>
      </div>

      ${state.editingDocId ? `<p class="price-note no-print" style="color:#2563eb;">✏️ 保存済みの書類を編集中です(保存すると上書きされます)</p>` : ""}

      <div class="btn-row no-print">
        <button class="btn-secondary" data-action="clear">${state.editingDocId ? "新規作成" : "クリア"}</button>
        <button class="btn-primary" data-action="save-doc">${state.editingDocId ? "更新保存する" : "保存する"}</button>
        <button class="btn-primary" data-action="print">🖨 印刷 / PDF保存</button>
      </div>
    </div>
  `;
}

function renderLineRow(it) {
  const workSelect = `<select data-li="${it.id}" data-field="work">
    ${WORK_TYPES.map((w) => `<option value="${w}" ${it.work === w ? "selected" : ""}>${w === "見出し行" ? "見出し" : w}</option>`).join("")}
  </select>
  ${it.work === "自由入力" ? `<input type="text" class="work-custom-input" data-li="${it.id}" data-field="workCustom" placeholder="作業内容を入力" value="${esc(it.workCustom)}" style="margin-top:3px;font-size:11px;" />` : ""}`;
  if (isHeading(it)) {
    return `
      <tr class="heading-row" data-row="${it.id}">
        <td class="col-work">${workSelect}</td>
        <td class="col-name" colspan="1"><input type="text" data-li="${it.id}" data-field="label" placeholder="見出し(例: 5F)" value="${esc(it.label)}" /></td>
        <td class="col-qty"></td>
        <td class="col-unit"></td>
        <td class="col-price"></td>
        <td class="col-amount"></td>
        <td class="col-note"><input type="text" data-li="${it.id}" data-field="note" placeholder="備考" value="${esc(it.note)}" /></td>
        <td class="col-del no-print"><button class="del-btn" data-action="del-line" data-id="${it.id}">🗑</button></td>
      </tr>`;
  }
  const isCore = hasCoreSize(it.work);
  const isHatsuri = it.work === "斫り" || it.work === "はつり";
  const nameField = isCore
    ? `<input type="text" data-li="${it.id}" data-field="label" placeholder="品名・階数など(任意)" value="${esc(it.label)}" />
       <div class="core-size-inline">
         <span>Φ</span><input type="text" inputmode="decimal" data-li="${it.id}" data-field="diameter" value="${esc(it.diameter)}" />
         <span>×厚</span><input type="text" inputmode="decimal" data-li="${it.id}" data-field="depth" value="${esc(it.depth)}" />
         <span>mm</span>
       </div>
       <p class="price-note" id="price-note-${it.id}">${coreTableForWork(it.work) && it.diameter && it.depth && !lookupCorePrice(it.diameter, it.depth, it.work) ? "表の範囲外(手入力)" : ""}</p>`
    : isHatsuri
    ? `<input type="text" data-li="${it.id}" data-field="label" placeholder="品名・階数など(任意)" value="${esc(it.label)}" />
       <div class="core-size-inline">
         <span>長</span><input type="text" inputmode="decimal" data-li="${it.id}" data-field="length" value="${esc(it.length)}" />
         <span>×幅</span><input type="text" inputmode="decimal" data-li="${it.id}" data-field="width" value="${esc(it.width)}" />
         <span>×深</span><input type="text" inputmode="decimal" data-li="${it.id}" data-field="depth" value="${esc(it.depth)}" />
         <span>mm</span>
       </div>`
    : `<input type="text" data-li="${it.id}" data-field="label" placeholder="${it.work === "自由入力" ? "品名を入力" : "品名・補足(任意)"}" value="${esc(it.label)}" />`;

  return `
    <tr data-row="${it.id}">
      <td class="col-work">${workSelect}</td>
      <td class="col-name">${nameField}</td>
      <td class="col-qty"><input type="text" inputmode="decimal" data-li="${it.id}" data-field="qty" value="${esc(it.qty)}" /></td>
      <td class="col-unit">
        <select data-li="${it.id}" data-field="unit">
          ${UNITS.map((u) => `<option value="${u}" ${it.unit === u ? "selected" : ""}>${u}</option>`).join("")}
        </select>
      </td>
      <td class="col-price"><input type="text" inputmode="decimal" data-li="${it.id}" data-field="price" value="${esc(it.price)}" /></td>
      <td class="col-amount" id="amount-${it.id}">${it.price ? esc(fmtNum(lineTotal(it))) : ""}</td>
      <td class="col-note"><input type="text" data-li="${it.id}" data-field="note" placeholder="備考" value="${esc(it.note)}" /></td>
      <td class="col-del no-print"><button class="del-btn" data-action="del-line" data-id="${it.id}">🗑</button></td>
    </tr>`;
}

function updateTotalsDom() {
  const subEl = document.getElementById("totals-subtotal");
  const legalEl = document.getElementById("totals-legal");
  const tenEl = document.getElementById("totals-ten");
  const taxEl = document.getElementById("totals-tax");
  const grandEl = document.getElementById("totals-grand");
  const boxEl = document.getElementById("total-box-val");
  if (subEl) subEl.textContent = fmtNum(subtotal());
  if (legalEl) legalEl.textContent = legalWelfareFormula();
  if (tenEl) tenEl.textContent = fmtNum(tenPercentBase());
  if (taxEl) taxEl.textContent = fmtNum(tax());
  if (grandEl) grandEl.textContent = fmtYen(grandTotal());
  if (boxEl) boxEl.textContent = fmtYen(grandTotal());
}

function bindDocRowEvents(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-action="open-doc"]').forEach((btn) => {
    btn.addEventListener("click", () => openDocument(btn.dataset.id));
  });
  scope.querySelectorAll('[data-action="delete-doc"]').forEach((btn) => {
    btn.addEventListener("click", () => deleteDocument(btn.dataset.id));
  });
  scope.querySelectorAll('[data-action="toggle-paid"]').forEach((btn) => {
    btn.addEventListener("click", () => togglePaid(btn.dataset.id));
  });
}

function bindEvents() {
  document.querySelectorAll('[data-action="main-tab"]').forEach((el) => {
    el.addEventListener("click", async () => {
      state.tab = el.dataset.val;
      saveDraft();
      render();
      if ((state.tab === "一覧" || state.tab === "集計") && API_URL) {
        await loadDocumentsFromCloud(true);
      }
    });
  });

  const refreshBtn = document.querySelector('[data-action="refresh"]');
  if (refreshBtn) refreshBtn.addEventListener("click", async () => { await loadDocumentsFromCloud(); });

  document.querySelectorAll('[data-action="doctype"]').forEach((el) => {
    el.addEventListener("click", () => {
      state.docType = el.dataset.val;
      // 未保存の新規書類で番号が空の場合は、その種類の次の連番を自動で入れる
      if (!state.editingDocId && !state.docNumber.trim()) {
        state.docNumber = getNextDocNumber(state.docType);
      }
      saveDraft();
      render();
    });
  });

  // 一覧タブ
  const searchEl = document.getElementById("doc-search-input");
  if (searchEl) {
    searchEl.addEventListener("input", (e) => {
      state.docQuery = e.target.value;
      saveDraft();
      const resultsEl = document.getElementById("doc-list-results");
      if (resultsEl) {
        resultsEl.innerHTML = renderDocListResults();
        bindDocRowEvents(resultsEl);
      }
    });
  }
  bindDocRowEvents(document);

  // 集計タブ
  const summaryYearEl = document.getElementById("summary-year-select");
  if (summaryYearEl) summaryYearEl.addEventListener("change", (e) => {
    state.summaryYear = e.target.value;
    state.summaryClient = "";
    saveDraft();
    render();
  });
  const summaryClientEl = document.getElementById("summary-client-select");
  if (summaryClientEl) summaryClientEl.addEventListener("change", (e) => {
    state.summaryClient = e.target.value;
    saveDraft();
    render();
  });

  // 作業伝票から読み込み
  const importBtn = document.querySelector('[data-action="import-genba"]');
  if (importBtn) importBtn.addEventListener("click", () => { openImportModal(); });

  const closeImportBtn = document.querySelector('[data-action="close-import-modal"]');
  if (closeImportBtn) closeImportBtn.addEventListener("click", () => { closeImportModal(); });

  const importSearchEl = document.getElementById("import-search-input");
  if (importSearchEl) importSearchEl.addEventListener("input", (e) => {
    importModal.query = e.target.value;
    const listEl = document.getElementById("import-modal-list");
    if (listEl) {
      listEl.innerHTML = renderImportModalListOnly();
      bindImportEntryButtons();
    }
  });

  bindImportEntryButtons();

  const exportExcelBtn = document.querySelector('[data-action="export-excel"]');
  if (exportExcelBtn) exportExcelBtn.addEventListener("click", exportSummaryExcel);

  const exportPdfBtn = document.querySelector('[data-action="export-pdf"]');
  if (exportPdfBtn) exportPdfBtn.addEventListener("click", exportSummaryPDF);

  // 会社ごとの締め日・支払い日
  document.querySelectorAll('[data-client][data-field="closingDay"], [data-client][data-field="paymentDay"]').forEach((el) => {
    el.addEventListener("input", (e) => {
      const client = el.dataset.client;
      const field = el.dataset.field;
      if (!state.clientSettings[client]) state.clientSettings[client] = { closingDay: "", paymentDay: "" };
      state.clientSettings[client][field] = e.target.value;
      saveDraft();
    });
  });

  document.querySelectorAll('[data-action="edit-client-setting"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      state.editingClientSetting = btn.dataset.client;
      render();
    });
  });

  document.querySelectorAll('[data-action="finish-client-setting"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      state.editingClientSetting = "";
      saveDraft();
      render();
      if (API_URL) await saveDocumentsToCloud();
    });
  });

  document.querySelectorAll('[data-action="delete-client-setting"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      const client = btn.dataset.client;
      if (!confirm(client + " の締め日・支払い日の設定を削除します。よろしいですか?")) return;
      delete state.clientSettings[client];
      if (state.editingClientSetting === client) state.editingClientSetting = "";
      saveDraft();
      render();
      if (API_URL) await saveDocumentsToCloud();
    });
  });

  const simpleFields = {
    "docnumber-input": "docNumber", "date-input": "docDate", "workdate-input": "workDate",
    "client-postal-input": "clientPostal",
    "client-address-input": "clientAddress", "client-tel-input": "clientTel", "client-fax-input": "clientFax",
    "issuer-name-input": "issuerName", "issuer-postal-input": "issuerPostal",
    "issuer-address-input": "issuerAddress", "issuer-tel-input": "issuerTel", "issuer-fax-input": "issuerFax",
    "site-input": "siteName", "regno-input": "issuerRegNo", "misc-note-input": "miscNote",
  };
  Object.keys(simpleFields).forEach((elId) => {
    const el = document.getElementById(elId);
    if (el) el.addEventListener("input", (e) => { state[simpleFields[elId]] = e.target.value; saveDraft(); });
  });

  const honorificEl = document.getElementById("client-honorific-input");
  if (honorificEl) honorificEl.addEventListener("change", (e) => { state.clientHonorific = e.target.value; saveDraft(); });

  // 宛先会社名の予測変換: 過去に保存した書類と同じ会社名になったら住所・電話・FAXを自動入力
  const clientNameEl = document.getElementById("client-name-input");
  if (clientNameEl) {
    clientNameEl.addEventListener("input", (e) => {
      state.clientName = e.target.value;
      const known = getKnownClients().find((c) => c.name === state.clientName.trim());
      if (known) {
        state.clientPostal = stripPostalMark(known.postal);
        state.clientAddress = known.address;
        state.clientTel = known.tel;
        state.clientFax = known.fax;
        state.clientHonorific = known.honorific;
        const postalEl = document.getElementById("client-postal-input");
        const addressEl = document.getElementById("client-address-input");
        const telEl = document.getElementById("client-tel-input");
        const faxEl = document.getElementById("client-fax-input");
        const honEl = document.getElementById("client-honorific-input");
        if (postalEl) postalEl.value = state.clientPostal;
        if (addressEl) addressEl.value = known.address;
        if (telEl) telEl.value = known.tel;
        if (faxEl) faxEl.value = known.fax;
        if (honEl) honEl.value = known.honorific;
      }
      saveDraft();
    });
  }

  document.querySelectorAll('[data-bank-idx]').forEach((el) => {
    el.addEventListener("input", (e) => {
      const idx = parseInt(el.dataset.bankIdx, 10);
      state.bankLines[idx] = e.target.value;
      saveDraft();
    });
  });
  document.querySelectorAll('[data-action="del-bank-line"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.bankLines.splice(idx, 1);
      if (state.bankLines.length === 0) state.bankLines = [""];
      saveDraft();
      render();
    });
  });
  const addBankBtn = document.querySelector('[data-action="add-bank-line"]');
  if (addBankBtn) addBankBtn.addEventListener("click", () => {
    state.bankLines.push("");
    saveDraft();
    render();
  });

  const eightPercentEl = document.getElementById("eight-percent-input");
  if (eightPercentEl) {
    eightPercentEl.addEventListener("input", (e) => { state.eightPercentAmount = e.target.value; saveDraft(); updateTotalsDom(); });
    eightPercentEl.addEventListener("blur", (e) => {
      const num = toNum(state.eightPercentAmount);
      if (!isNaN(num)) {
        state.eightPercentAmount = num.toLocaleString();
        e.target.value = state.eightPercentAmount;
        saveDraft();
        updateTotalsDom();
      }
    });
  }

  const issuerPresetEl = document.getElementById("issuer-preset-input");
  if (issuerPresetEl) issuerPresetEl.addEventListener("change", (e) => {
    state.issuerPreset = e.target.value;
    Object.assign(state, ISSUER_PRESETS[e.target.value]);
    saveDraft();
    render();
  });

  const stampToggleEl = document.getElementById("stamp-toggle-input");
  if (stampToggleEl) stampToggleEl.addEventListener("change", (e) => {
    state.showStamp = e.target.checked;
    saveDraft();
    render();
  });

  const miscEl = document.getElementById("misc-input");
  if (miscEl) {
    miscEl.addEventListener("input", (e) => { state.miscExpense = e.target.value; saveDraft(); updateTotalsDom(); });
    miscEl.addEventListener("blur", (e) => {
      const num = toNum(state.miscExpense);
      if (!isNaN(num)) {
        state.miscExpense = num.toLocaleString();
        e.target.value = state.miscExpense;
        saveDraft();
        updateTotalsDom();
      }
    });
  }

  document.querySelectorAll('[data-li]').forEach((el) => {
    const eventName = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(eventName, (e) => {
      const id = el.dataset.li;
      const field = el.dataset.field;
      const val = e.target.value;
      const item = state.items.find((it) => it.id === id);
      if (!item) return;
      item[field] = val;

      if (field === "diameter" || field === "depth") {
        const auto = lookupCorePrice(item.diameter, item.depth, item.work);
        if (auto != null) { item.price = String(auto); item.autoPriced = true; }
        else { item.autoPriced = false; }
      }
      if (field === "price") item.autoPriced = false;

      saveDraft();

      if (field === "work") {
        // 作業内容を切り替えたとき、サイズ入力済みなら単価表に合わせて再計算する
        if (hasCoreSize(item.work) && item.diameter && item.depth) {
          const auto = lookupCorePrice(item.diameter, item.depth, item.work);
          if (auto != null) { item.price = String(auto); item.autoPriced = true; }
        }
        saveDraft();
        render();
        return;
      }

      if (field === "diameter" || field === "depth") {
        const priceInput = document.querySelector(`[data-li="${id}"][data-field="price"]`);
        if (priceInput) priceInput.value = item.price;
        const noteEl = document.getElementById(`price-note-${id}`);
        if (noteEl) {
          noteEl.textContent = (coreTableForWork(item.work) && item.diameter && item.depth && !lookupCorePrice(item.diameter, item.depth, item.work))
            ? "表の範囲外(手入力)" : "";
        }
        const amountEl = document.getElementById(`amount-${id}`);
        if (amountEl) amountEl.textContent = item.price ? fmtNum(lineTotal(item)) : "";
        updateTotalsDom();
        return;
      }

      const amountEl = document.getElementById(`amount-${id}`);
      if (amountEl) amountEl.textContent = item.price ? fmtNum(lineTotal(item)) : "";
      updateTotalsDom();
    });

    if (el.dataset.field === "price" || el.dataset.field === "qty") {
      el.addEventListener("blur", (e) => {
        const id = el.dataset.li;
        const field = el.dataset.field;
        const item = state.items.find((it) => it.id === id);
        if (!item) return;
        const num = toNum(item[field]);
        if (!isNaN(num)) {
          item[field] = num.toLocaleString();
          e.target.value = item[field];
          saveDraft();
          const amountEl = document.getElementById(`amount-${id}`);
          if (amountEl) amountEl.textContent = item.price ? fmtNum(lineTotal(item)) : "";
          updateTotalsDom();
        }
      });
    }
  });

  document.querySelectorAll('[data-action="del-line"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      if (state.items.length > 1) {
        state.items = state.items.filter((it) => it.id !== btn.dataset.id);
      } else {
        state.items = [newLineItem()];
      }
      saveDraft();
      render();
    });
  });

  const addLineBtn = document.querySelector('[data-action="add-line"]');
  if (addLineBtn) addLineBtn.addEventListener("click", () => { state.items.push(newLineItem()); saveDraft(); render(); });

  const saveDocBtn = document.querySelector('[data-action="save-doc"]');
  if (saveDocBtn) saveDocBtn.addEventListener("click", saveDocument);

  const clearBtn = document.querySelector('[data-action="clear"]');
  if (clearBtn) clearBtn.addEventListener("click", () => {
    if (confirm("入力内容をすべてクリアして新規作成します(会社情報は残ります)。よろしいですか?")) {
      state = Object.assign({}, state, {
        editingDocId: null,
        docNumber: getNextDocNumber(state.docType), docDate: todayStr(), workDate: "",
        clientName: "", clientHonorific: "様", clientPostal: "", clientAddress: "", clientTel: "", clientFax: "",
        siteName: "",
        miscExpense: "", miscNote: "", eightPercentAmount: "", items: [newLineItem()],
      });
      saveDraft();
      render();
    }
  });

  const printBtn = document.querySelector('[data-action="print"]');
  if (printBtn) printBtn.addEventListener("click", () => { preparePrint(); window.print(); });
}

function preparePrint() {
  document.querySelectorAll("#app select").forEach((sel) => {
    const existing = sel.nextElementSibling;
    if (existing && (existing.classList.contains("print-select-value") || existing.classList.contains("print-input-value"))) {
      existing.remove();
    }
    // 印刷では表示しないプルダウン(会社プリセット選択、宛先敬称)は
    // 別枠で処理するため、ここではテキスト置換を作らない
    if (sel.classList.contains("no-print") || sel.id === "client-honorific-input") return;
    const span = document.createElement("span");
    span.className = "print-select-value";
    if (sel.dataset.field === "work" && sel.value === "自由入力") {
      // 作業内容が「自由入力」の場合は、入力された作業名を印刷表示する
      const customInput = document.querySelector(`input.work-custom-input[data-li="${sel.dataset.li}"]`);
      span.textContent = (customInput && customInput.value.trim()) ? customInput.value : "自由入力";
    } else {
      const opt = sel.options[sel.selectedIndex];
      span.textContent = opt ? opt.text : "";
    }
    sel.insertAdjacentElement("afterend", span);
  });

  // 振込先が長い場合に入力欄の幅で文字が切れてしまうのを防ぐため、折り返し可能なテキストとして印刷表示する
  document.querySelectorAll('.bank-line-row input[data-bank-idx]').forEach((input) => {
    const existing = input.nextElementSibling;
    if (existing && existing.classList.contains("print-bank-value")) existing.remove();
    const span = document.createElement("span");
    span.className = "print-bank-value";
    span.textContent = input.value;
    input.insertAdjacentElement("afterend", span);
  });

  // 宛先の会社名＋様/御中を1つのテキストにまとめて印刷表示(レイアウト崩れ防止)
  const clientNameInput = document.getElementById("client-name-input");
  const honorificSelect = document.getElementById("client-honorific-input");
  if (clientNameInput && honorificSelect) {
    const existingCombo = clientNameInput.nextElementSibling;
    if (existingCombo && existingCombo.classList.contains("print-input-value")) existingCombo.remove();
    const combo = document.createElement("span");
    combo.className = "print-input-value";
    combo.textContent = clientNameInput.value + (honorificSelect.value ? "　" + honorificSelect.value : "");
    clientNameInput.insertAdjacentElement("afterend", combo);
  }
}

(async () => {
  loadDraft();
  if (API_URL) {
    await loadDocumentsFromCloud(true);
  }
  // 新規書類でまだ番号が入っていなければ、連番を自動で入れる
  if (!state.editingDocId && !state.docNumber.trim()) {
    state.docNumber = getNextDocNumber(state.docType);
  }
  render();
})();
</script>
</body>
</html>
